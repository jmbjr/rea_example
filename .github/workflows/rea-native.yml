name: REA native experiment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rea-native.yml'
      - 'tools/capture_rea.py'
      - 'target/build-cli.sh'
      - 'target/cli-only-stubs.c'
      - 'target/fixed-time.c'
      - 'target/flag-oracle.c'
      - 'tools/capture_flag_oracle.py'
      - 'tools/verify_step3.py'
      - 'evidence/step3/**'

permissions:
  contents: read

concurrency:
  group: rea-native
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Record runner prerequisites
        shell: bash
        run: |
          mkdir -p evidence/actions
          {
            uname -a
            cat /etc/os-release
            node --version
            npm --version
            java -version
            javac -version
            gcc --version
            ldd --version
            ps -eo pid,ppid,args
          } > evidence/actions/environment.txt 2>&1
          ps -p $$ -o pid=,ppid=,args=
      - name: Install pinned REA and verified Ghidra
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rea-runtime" --ignore-scripts --no-audit --no-fund rea-agents@6.5.0 2>&1 | tee evidence/actions/npm-install.txt
          cp "$RUNNER_TEMP/rea-runtime/package-lock.json" evidence/actions/rea-package-lock.json
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/ghidra.zip" https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" | sha256sum --check | tee evidence/actions/ghidra-checksum.txt
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/ghidra/ghidra_12.1.4_PUBLIC" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/ghidra/ghidra_12.1.4_PUBLIC/Ghidra/application.properties" evidence/actions/ghidra-application.properties
      - name: Acquire and build pinned target
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/brenns10/minesweeper.git "$RUNNER_TEMP/minesweeper-upstream"
          git -C "$RUNNER_TEMP/minesweeper-upstream" checkout --detach c7cadf1f7ed57d950b400d965a7d3bbab5e50bed
          git -C "$RUNNER_TEMP/minesweeper-upstream" rev-parse HEAD > evidence/actions/upstream-commit.txt
          sh target/build-cli.sh "$RUNNER_TEMP/minesweeper-upstream" evidence/actions/build 2>&1 | tee evidence/actions/build.txt
          cp "$RUNNER_TEMP/minesweeper-upstream/LICENSE.txt" evidence/actions/build/LICENSE.minesweeper.txt
          gcc -std=c99 -Wall -Wextra -shared -fPIC target/fixed-time.c -o evidence/actions/build/fixed-time.so
          sha256sum evidence/actions/build/* > evidence/actions/build-sha256.txt
          python3 tools/verify_step3.py evidence/actions/build/minesweeper-cli evidence/actions/build/fixed-time.so evidence/step3 2>&1 | tee evidence/actions/replay.txt
      - name: Build and capture native flag oracle
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c99 -g -Wall -Wextra -I"$RUNNER_TEMP/minesweeper-upstream/src" "$RUNNER_TEMP/minesweeper-upstream/src/minesweeper.c" target/flag-oracle.c -o evidence/actions/build/flag-oracle
          sha256sum evidence/actions/build/flag-oracle | tee evidence/actions/oracle-sha256.txt
          python3 tools/capture_flag_oracle.py evidence/actions/build/flag-oracle evidence/actions/oracle
      - name: Analyze with REA and inspect bounded flag behavior
        shell: bash
        run: |
          python3 tools/capture_rea.py "$RUNNER_TEMP/rea-runtime/node_modules/rea-agents/scripts/rea.mjs" evidence/actions/build/minesweeper-cli evidence/actions/rea
      - name: Upload complete evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-native-evidence
          path: evidence/actions/
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize outcome
        if: always()
        shell: bash
        run: |
          {
            echo '## REA native experiment'
            echo 'Download rea-native-evidence for raw outputs, target identity, executable, licenses and diagnostics.'
            echo 'Workflow success means commands ran successfully; human review of evidence is still required.'
            echo 'The target contains debug symbols; selected function names were already exposed by source metadata.'
            if test -f evidence/actions/rea/commands.json; then
              echo '~~~json'
              cat evidence/actions/rea/commands.json
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
